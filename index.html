<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartela Pronta</title>
<meta name="description" content="Escolha seus números da rifa e pague com Pix, direto ao organizador.">
<meta name="theme-color" content="#3F3DBC">
<meta property="og:title" content="Cartela Pronta">
<meta property="og:description" content="Escolha seus números da rifa e pague com Pix.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233F3DBC'/%3E%3Cpath d='M14 22h36v8a4 4 0 0 0 0 8v8H14v-8a4 4 0 0 0 0-8z' fill='%23FF6B57'/%3E%3Cpath d='M38 24v2m0 5v2m0 5v2m0 5v2' stroke='%233F3DBC' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Bilhete destacável: cabeçalho índigo com o prêmio, picote, cartela de números e barra de reserva fixa embaixo */
:root{
  --bg:#F4F3FB; --surface:#FFFFFF; --surface-2:#ECEBF7; --ink:#1B1838; --muted:#625E85; --line:#DAD8EC;
  --indigo:#3F3DBC; --on-indigo:#FFFFFF; --coral:#FF6B57; --on-coral:#2B0A04;
  --ambar:#F0B429; --ambar-soft:#FFF1CC; --erro:#D63B3B; --erro-soft:#FBE2E2; --qr:#FFFFFF;
  --shadow:0 1px 2px rgba(27,24,56,.06),0 10px 30px rgba(27,24,56,.10);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#100F1E; --surface:#1A1930; --surface-2:#24223F; --ink:#ECEAFB; --muted:#A4A0C8; --line:#322F55;
  --indigo:#8E8CF5; --on-indigo:#14123A; --coral:#FF8A78; --on-coral:#2B0A04;
  --ambar:#FFC857; --ambar-soft:#3A2E0A; --erro:#F27A7A; --erro-soft:#3E1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.12;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:24px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 16px}
.marca{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.marca svg{width:30px;height:30px;flex:none}
.selo{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap;min-width:0}
@media (max-width:400px){.selo .longo{display:none}}
.selo svg{width:13px;height:13px}
.ticket{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.t-head{background:linear-gradient(145deg,var(--indigo) 0%,color-mix(in srgb,var(--indigo) 72%,#000) 100%);color:var(--on-indigo);padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px}
.t-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb,var(--on-indigo) 18%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--coral)}
.chip.done::before{background:var(--ambar)}
.premio{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--on-indigo) 14%,transparent);border-radius:14px;padding:10px 12px}
.premio svg{width:22px;height:22px;flex:none}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;opacity:.8}
.t-head h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
.premio span{font-size:16px;font-weight:600;line-height:1.3}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.facts div{background:color-mix(in srgb,var(--on-indigo) 10%,transparent);border-radius:12px;padding:9px 10px;min-width:0}
.facts dt{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.facts dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-indigo) 20%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral)}
.t-head .small{margin:6px 0 0;font-size:13px;opacity:.9}
.perf{height:18px;position:relative;background-image:radial-gradient(circle,var(--line) 2px,transparent 2.5px);background-size:14px 18px;background-position:center;background-repeat:repeat-x}
.perf::before,.perf::after{content:"";position:absolute;top:0;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.perf::before{left:-9px}.perf::after{right:-9px}
.corpo{padding:6px 18px 0;display:flex;flex-direction:column;gap:14px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.n{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-variant-numeric:tabular-nums;transition:transform .12s}
.n:hover:not(:disabled){transform:translateY(-1px);border-color:var(--indigo)}
.n.sel{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.n:disabled{background:var(--surface-2);border-color:transparent;color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.n.win{outline:3px solid var(--coral);outline-offset:2px;text-decoration:none;color:var(--ink)}
.faixas{display:flex;gap:6px;flex-wrap:wrap}
.faixas button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;font-family:var(--f-mono)}
.faixas button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cart{position:sticky;bottom:0;margin:0 -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cart b{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-main{background:var(--coral);color:var(--on-coral);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
.hint{font-weight:400;font-size:12px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-family:var(--f-mono);font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--ambar-soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.err{background:var(--erro-soft);color:var(--erro);border-radius:12px;padding:10px 12px;margin:0;font-weight:600}
.pix{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-bottom:22px}
.ok{background:var(--ambar-soft);border-radius:99px;padding:6px 12px;font-weight:700}
.valor{font-family:var(--f-display);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
#qr{background:var(--qr);padding:12px;border-radius:14px;line-height:0}
.code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:10px;border-radius:10px;word-break:break-all;text-align:left;width:100%}
.pix p{margin:0}
.exato{background:var(--ambar-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.winner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--surface-2);border-radius:14px;padding:16px;margin-top:8px}
.winner .big{font-family:var(--f-mono);font-weight:700;font-size:40px;background:var(--coral);color:var(--on-coral);padding:8px 16px;border-radius:10px}
.winner p{margin:2px 0}
.estado{padding:40px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.estado p{margin:0;max-width:40ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
.rodape{display:flex;gap:8px;align-items:flex-start;justify-content:center;text-align:left;font-size:12.5px;color:var(--muted);margin:18px auto 0;max-width:420px}
.rodape svg{width:15px;height:15px;flex:none;margin-top:2px}
@media (max-width:420px){.t-head h1{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}.n{font-size:13px;padding:9px 0}}
body{background-image:radial-gradient(900px 340px at 50% -120px,color-mix(in srgb,var(--indigo) 22%,transparent),transparent 70%);background-repeat:no-repeat}
.ticket{border:1px solid var(--line);border-radius:24px}
.passos{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.passos li{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.passos b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--muted);flex:none}
.passos li.on{color:var(--ink)} .passos li.on b{background:var(--coral);color:var(--on-coral)}
.passos li.feito b{background:var(--indigo);color:var(--on-indigo)}
.passos span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n{border-radius:10px;min-height:42px;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 6%,transparent)}
.n.sel{transform:scale(1.05);box-shadow:0 4px 12px color-mix(in srgb,var(--coral) 45%,transparent)}
.cart{margin:0 -18px;border-radius:18px 18px 0 0;box-shadow:0 -10px 24px color-mix(in srgb,var(--ink) 9%,transparent)}
.btn{min-height:48px;border-radius:14px;padding:12px 18px}
.btn-main{background:linear-gradient(180deg,color-mix(in srgb,var(--coral) 88%,#fff),var(--coral));box-shadow:0 6px 16px color-mix(in srgb,var(--coral) 35%,transparent)}
.btn-main:disabled{box-shadow:none}
.input{min-height:48px;border-radius:14px;transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 4px color-mix(in srgb,var(--indigo) 22%,transparent)}
.form h2{letter-spacing:-.01em}
.pix .valor{font-size:40px;letter-spacing:-.02em}
#qr{border:1px solid var(--line);border-radius:18px;padding:14px}
.pix .btn{width:100%}
.exato{width:100%;text-align:center}
.winner{border:1px solid var(--line)}
.skel{display:grid;gap:14px;padding:22px}
.skel i{display:block;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:brilho 1.3s linear infinite}
@keyframes brilho{to{background-position:-200% 0}}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sobe{from{transform:translateY(100%)}to{transform:none}}
@keyframes pula{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1.05)}}
.corpo>*{animation:entra .35s ease both}
.cart{animation:sobe .28s cubic-bezier(.2,.8,.2,1) both}
.n.sel{animation:pula .25s ease both}
.bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
/* Situação de cada número: livre, sua escolha, aguardando Pix, vendido e os seus (o participante reconhece os dele). */
.n:disabled{text-decoration:none}
.n.res{background:var(--ambar-soft);border:1.5px dashed color-mix(in srgb,var(--ambar) 75%,transparent);color:color-mix(in srgb,var(--ink) 72%,transparent)}
.n.vend{background:var(--surface-2);border-color:transparent;color:color-mix(in srgb,var(--muted) 80%,transparent)}
.n.meu{position:relative;color:var(--ink);opacity:1}
.n.meu.res{background:var(--ambar-soft);border:2px solid var(--ambar)}
.n.meu.pago{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.n.meu::after{content:"seu";position:absolute;top:-7px;right:-4px;font:700 9px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:2px 4px;border-radius:5px;background:var(--ambar);color:#2B1D00}
.n.meu.pago::after{content:"✓";background:var(--coral);color:var(--on-coral);font-size:10px;padding:2px 4px}
.dot.d-sel{background:var(--coral);border-color:var(--coral)}
.tag-seu{font:700 9px/1 var(--f-body);letter-spacing:.04em;padding:3px 4px;border-radius:5px;background:var(--ambar);color:#2B1D00}
.dot.d-res{background:var(--ambar-soft);border:1.5px dashed var(--ambar)}
.dot.d-vend{background:var(--surface-2);border-color:transparent}
.passos{display:flex;justify-content:space-between;gap:6px}
.passos li{gap:5px;font-size:12px}
@media (max-width:400px){.passos li{font-size:11.5px}.passos b{width:22px;height:22px}}
/* Seus números: um cartão por pedido feito neste aparelho. */
.meus{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:16px;padding:12px}
.meus h3{font-size:16px}
.pedido{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pedido-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.aguardando,.pill.carregando{background:var(--ambar-soft);color:color-mix(in srgb,var(--ink) 85%,var(--ambar))}
.pill.pago{background:var(--indigo);color:var(--on-indigo)}
.pill.expirado{background:var(--erro-soft);color:var(--erro)}
.chips span.pago{background:var(--indigo);color:var(--on-indigo)}
.chips span.expirado{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.chips.grandes{justify-content:center}
.chips.grandes span{font-size:17px;padding:6px 12px;border-radius:9px}
.btn-mini{min-height:36px;padding:6px 14px;font-size:13px;border-radius:10px}
/* Situação do pedido no topo da tela do Pix. */
.status{width:100%;border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.status h2{font-size:24px}
.status p{margin:0}
.status.aguardando{flex-direction:row;align-items:flex-start;text-align:left;background:var(--ambar-soft);border:1px solid color-mix(in srgb,var(--ambar) 55%,transparent)}
.status.aguardando b{font-size:16px}
.status.pago{background:linear-gradient(160deg,var(--indigo),color-mix(in srgb,var(--indigo) 70%,#000));color:var(--on-indigo)}
.status.pago .chips span{background:color-mix(in srgb,var(--on-indigo) 18%,transparent);color:var(--on-indigo)}
.status.expirado{background:var(--erro-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--erro) 40%,transparent)}
.selo-ok{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:800;background:var(--coral);color:var(--on-coral)}
.pulso{width:12px;height:12px;border-radius:50%;background:var(--ambar);flex:none;margin-top:5px;animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ambar) 60%,transparent)}50%{box-shadow:0 0 0 8px transparent}}
.festa{animation:festa .7s cubic-bezier(.2,1.4,.4,1) both}
.festa .selo-ok{animation:carimbo .6s .15s cubic-bezier(.2,1.6,.4,1) both}
@keyframes festa{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@keyframes carimbo{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topo"><div class="marca"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#3F3DBC"/><path d="M14 22h36v8a4 4 0 0 0 0 8v8H14v-8a4 4 0 0 0 0-8z" fill="#FF6B57"/><path d="M38 24v2m0 5v2m0 5v2m0 5v2" stroke="#3F3DBC" stroke-width="2.4" stroke-linecap="round"/></svg>Cartela Pronta</div><span class="selo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Pix direto<span class="longo">&nbsp;ao organizador</span></span></div>
  <article class="ticket" id="app"><div class="skel" aria-label="Carregando a rifa"><i style="height:26px;width:55%"></i><i style="height:44px"></i><i style="height:58px"></i><i style="height:180px"></i></div></article>
  <p class="rodape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>O pagamento vai direto para o organizador. A Cartela Pronta só organiza os números e não recebe nem guarda dinheiro. Seu telefone só o organizador vê.</span></p>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const FAIXA = 200;

/* ---------- Pix copia e cola (mesma regra do app) ---------- */
const campo = (id, v) => id + String(v.length).padStart(2, "0") + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF } return c.toString(16).toUpperCase().padStart(4, "0") }
const limpar = s => String(s).normalize("NFD").replace(/\p{M}/gu, "").replace(/[^A-Za-z0-9 ]/g, "").toUpperCase().trim();
function codigo(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36).toUpperCase().padStart(7, "0").slice(-7) }
function pix(r, valor, ref) {
  const txid = ("RIFA" + codigo(r.id + ref)).slice(0, 25);
  const p = campo("00", "01") + campo("26", campo("00", "br.gov.bcb.pix") + campo("01", r.pixChave.trim())) + campo("52", "0000") + campo("53", "986")
    + campo("54", valor.toFixed(2)) + campo("58", "BR") + campo("59", limpar(r.pixNome).slice(0, 25) || "RECEBEDOR")
    + campo("60", limpar(r.cidade).slice(0, 15) || "BRASIL") + campo("62", campo("05", txid)) + "6304";
  return p + crc16(p);
}

/* ---------- estado ---------- */
const id = new URLSearchParams(location.search).get("r");
const st = { rifa: null, ocupados: new Set(), info: new Map(), sel: [], enviando2: false, etapa: "grade", faixa: 0, erro: "", enviando: false, reserva: null, pedidos: [], carregou: false, festa: "" };

/* Pedidos deste aparelho: a página lembra quais números são seus, para mostrar a situação de cada um. Fica só no celular. */
const LS = "cartela-pedidos-" + id, LS_ANTIGO = "cartela-reserva-" + id;
function lerPedidos() {
  try {
    const l = JSON.parse(localStorage.getItem(LS) || "null"); if (Array.isArray(l)) return l;
    const a = JSON.parse(localStorage.getItem(LS_ANTIGO) || "null"); return a ? [a] : [];
  } catch (e) { return [] }
}
function salvarPedidos() { try { localStorage.setItem(LS, JSON.stringify(st.pedidos)); localStorage.removeItem(LS_ANTIGO) } catch (e) { } }
st.pedidos = lerPedidos();
if (st.pedidos.length) { st.reserva = st.pedidos[st.pedidos.length - 1]; st.etapa = "pix" }

/* Situação de um pedido pelo que a cartela pública mostra: "pago", "aguardando", "expirado" ou "carregando". */
const centavos = p => p.valorCent || Math.round(p.total * 100);
function situacao(p) {
  if (!st.carregou) return "carregando";
  const meus = p.nums.map(n => st.info.get(n)).filter(d => d && (!d.v || d.v === centavos(p)));
  if (meus.length === p.nums.length && meus.every(d => d.status === "pago")) return "pago";
  if (meus.some(d => d.status === "reservado")) return "aguardando";
  return meus.some(d => d.status === "pago") ? "pago" : "expirado";
}
/* Tempo que falta para pagar, contado da hora da reserva gravada no servidor. */
function prazo(p) {
  const ts = p.nums.map(n => st.info.get(n)?.ts?.toMillis?.()).filter(Boolean);
  if (!ts.length || !st.rifa) return "";
  const falta = Math.min(...ts) + st.rifa.prazoHoras * 3600e3 - Date.now();
  if (falta <= 0) return "O prazo acabou, mas o organizador ainda pode confirmar";
  const h = Math.floor(falta / 3600e3), m = Math.floor(falta % 3600e3 / 60e3);
  return `Pague em até ${h ? h + " h " : ""}${m} min`;
}
/* Número → pedido deste aparelho que ainda vale (não expirado). */
function meusNumeros() {
  const m = new Map();
  for (const p of st.pedidos) { const s = situacao(p); if (s !== "expirado") for (const n of p.nums) m.set(n, s) }
  return m;
}

const pad = n => String(n).padStart(String(st.rifa.qtd).length, "0");
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2800) }

function estado(titulo, texto) { $("#app").innerHTML = `<div class="estado"><h2>${esc(titulo)}</h2><p class="muted">${esc(texto)}</p></div>` }

if (!id) estado("Link incompleto", "Peça ao organizador o link completo da rifa.");
else if (firebaseConfig.apiKey === "COLE_AQUI") estado("Página ainda não configurada", "O organizador precisa colar a configuração do Firebase no arquivo config.js.");
else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const ref = doc(db, "rifas", id);
  onSnapshot(ref, s => {
    if (!s.exists()) { estado("Rifa não encontrada", "Confira o link com o organizador."); return }
    st.rifa = { id, ...s.data() }; render();
  }, () => estado("Não deu para abrir a rifa", "Verifique sua internet e tente de novo."));
  onSnapshot(collection(ref, "numeros"), s => {
    st.info = new Map(s.docs.map(d => [+d.id, d.data()]));
    st.ocupados = new Set(st.info.keys());
    st.carregou = true;
    // Pedido que acabou de ser confirmado: comemora uma vez só (fica marcado no aparelho).
    for (const p of st.pedidos) if (!p.avisado && situacao(p) === "pago") {
      p.avisado = true; salvarPedidos(); st.festa = p.grupo;
      // Mostra a confirmação, a não ser que a pessoa esteja preenchendo outra reserva.
      if (st.etapa !== "form") { st.reserva = p; st.etapa = "pix" }
      toast("Pagamento confirmado! Seus números estão garantidos.");
      try { navigator.vibrate?.([60, 40, 120]) } catch (e) { }
    }
    const antes = st.sel.length; st.sel = st.sel.filter(n => !st.ocupados.has(n));
    if (antes !== st.sel.length && st.etapa !== "pix") toast("Alguém acabou de pegar um número que você tinha escolhido");
    if (st.rifa) render();
  });

  // O prazo para pagar corre a cada minuto enquanto o Pix está na tela.
  setInterval(() => { if (st.rifa && st.etapa === "pix" && st.reserva && situacao(st.reserva) === "aguardando") render() }, 60e3);

  window.reservar = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target), nome = String(f.get("nome")).trim(), tel = String(f.get("tel")).trim();
    if (nome.length < 2 || tel.replace(/\D/g, "").length < 10) { st.erro = "Preencha seu nome e um WhatsApp com DDD."; render(); return }
    const nums = st.sel.slice().sort((a, b) => a - b);
    const grupo = codigo(nome + tel + Date.now());
    const base = Math.round(nums.length * st.rifa.preco * 100);
    const usados = new Set([...st.info.values()].filter(d => d.status === "reservado" && d.v).map(d => d.v));
    const livres = []; for (let c = 1; c <= 99; c++) if (!usados.has(base + c)) livres.push(base + c);
    const valorCent = livres.length ? livres[Math.floor(Math.random() * livres.length)] : base + 1 + Math.floor(Math.random() * 99);
    const b = writeBatch(db);
    for (const n of nums) {
      b.set(doc(ref, "numeros", String(n)), { status: "reservado", ts: serverTimestamp(), v: valorCent });
      b.set(doc(ref, "reservas", String(n)), { nome: nome.slice(0, 60), tel: tel.slice(0, 20), ts: serverTimestamp(), grupo });
    }
    st.enviando = true; st.erro = ""; render();
    try {
      await b.commit();
      const total = valorCent / 100;
      st.reserva = { nums, total, valorCent, payload: pix(st.rifa, total, grupo), grupo, comprovante: false, nome: nome.slice(0, 60), quando: Date.now() };
      st.pedidos.push(st.reserva); salvarPedidos();
      st.sel = []; st.etapa = "pix"; scrollTo(0, 0);
    } catch (e) {
      st.erro = "Um desses números acabou de ser escolhido por outra pessoa. Confira a cartela e tente de novo.";
      st.etapa = "grade";
    }
    st.enviando = false; render();
  };
}

/* ---------- telas ---------- */
function render() {
  const r = st.rifa; if (!r) return;
  const usados = st.ocupados.size, metodo = r.metodo === "federal" ? "Loteria Federal" : "No app";
  const sorteada = r.status === "sorteada", restam = r.qtd - usados, pct = Math.round(usados / r.qtd * 100);
  $("#app").innerHTML = `<header class="t-head"><div class="t-top"><span class="eyebrow">Rifa de ${esc(r.pixNome)}</span><span class="chip${sorteada ? " done" : ""}">${sorteada ? "Sorteada" : "Aberta"}</span></div>
    <h1>${esc(r.nome)}</h1><div class="premio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg><span>${esc(r.premio)}</span></div>
    <dl class="facts"><div><dt>Cada número</dt><dd>${brl(r.preco)}</dd></div><div><dt>Sorteio</dt><dd>${esc(r.data || "a definir")}</dd></div><div><dt>Como</dt><dd>${metodo}</dd></div></dl>
    <div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${(usados / r.qtd * 100).toFixed(2)}%"></i></div><p class="small">${sorteada ? `${usados} de ${r.qtd} números vendidos` : `<b>${restam} números livres</b> · ${pct}% já escolhidos`}</p></div></header>
    <div class="perf" aria-hidden="true"></div><div class="corpo">${sorteada ? "" : passos()}${corpo(r)}</div>`;
  const el = $("#qr");
  if (el && st.reserva && window.QRCode) {
    el.innerHTML = "";
    try { new QRCode(el, { text: st.reserva.payload, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }) } catch (e) { el.hidden = true }
  }
  st.festa = "";
}
function passos() {
  const pago = st.etapa === "pix" && st.reserva && situacao(st.reserva) === "pago";
  const e = pago ? 5 : st.etapa === "pix" ? 3 : st.etapa === "form" ? 2 : 1, nomes = ["Escolher", "Dados", "Pagar", "Confirmado"];
  return `<ol class="passos" aria-label="Etapas">${nomes.map((n, i) => `<li class="${i + 1 === e ? "on" : i + 1 < e ? "feito" : ""}"><b>${i + 1 < e ? "✓" : i + 1}</b><span>${n}</span></li>`).join("")}</ol>`;
}
const ROTULO = { pago: "Confirmado", aguardando: "Aguardando Pix", expirado: "Expirado", carregando: "Conferindo…" };
/* Painel com os pedidos feitos neste aparelho, cada um com a situação ao vivo. */
function seusNumeros() {
  if (!st.pedidos.length) return "";
  const itens = st.pedidos.slice().reverse().map(p => {
    const s = situacao(p);
    return `<div class="pedido"><div class="pedido-topo"><span class="pill ${s}">${s === "pago" ? "✓ " : ""}${ROTULO[s]}</span><span class="small muted">${esc(p.nome || "")}${p.nome ? " · " : ""}${brl(p.total)}</span></div>
      <div class="chips">${p.nums.map(n => `<span class="${s}">${pad(n)}</span>`).join("")}</div>
      ${s === "aguardando" ? `<button class="btn btn-mini" data-ver="${esc(p.grupo)}">Ver o Pix</button>` : s === "expirado" ? `<button class="btn btn-mini" data-tirar="${esc(p.grupo)}">Remover da lista</button>` : ""}</div>`;
  }).join("");
  return `<section class="meus" aria-label="Seus números"><h3>Seus números</h3>${itens}</section>`;
}
function faixas(r) {
  if (r.qtd <= FAIXA) return "";
  let h = ""; for (let i = 0; i * FAIXA < r.qtd; i++) h += `<button data-faixa="${i}" aria-pressed="${i === st.faixa}">${pad(i * FAIXA + 1)}–${pad(Math.min(r.qtd, (i + 1) * FAIXA))}</button>`;
  return `<div class="faixas">${h}</div>`;
}
function grade(r, travada) {
  const ini = st.faixa * FAIXA + 1, fim = Math.min(r.qtd, (st.faixa + 1) * FAIXA), meus = meusNumeros(); let h = "";
  for (let n = ini; n <= fim; n++) {
    const win = r.vencedor && r.vencedor.numero === n, d = st.info.get(n), meu = meus.get(n);
    if (st.ocupados.has(n) || travada) {
      // Seus números em destaque; dos outros, "aguardando Pix" é diferente de "vendido".
      const cls = meu ? (meu === "pago" ? "meu pago" : "meu res") : d?.status === "pago" ? "vend" : d ? "res" : "";
      const txt = meu ? (meu === "pago" ? "seu, pago" : "seu, aguardando Pix") : d?.status === "pago" ? "vendido" : d ? "reservado, aguardando Pix" : "indisponível";
      h += `<button class="n ${cls}${win ? " win" : ""}" disabled aria-label="Número ${pad(n)}: ${txt}">${pad(n)}</button>`;
    }
    else { const s = st.sel.includes(n); h += `<button class="n${s ? " sel" : ""}" data-n="${n}" aria-pressed="${s}">${pad(n)}</button>` }
  }
  return `<div class="grid">${h}</div>`;
}
function corpo(r) {
  if (r.status === "sorteada" && r.vencedor) {
    const meus = meusNumeros(), ganhei = meus.get(r.vencedor.numero) === "pago";
    return `${ganhei ? `<div class="status pago festa"><span class="selo-ok" aria-hidden="true">★</span><h2>Você ganhou!</h2><p>O número ${pad(r.vencedor.numero)} é seu. ${esc(r.pixNome)} vai falar com você pelo WhatsApp.</p></div>` : ""}
      <div class="winner"><span class="big">${pad(r.vencedor.numero)}</span><div><span class="eyebrow muted">Resultado</span><h3>${esc(r.vencedor.primeiroNome || "Ganhador")} ganhou!</h3><p class="small">${esc(r.vencedor.detalhe || "")}</p></div></div>${seusNumeros()}${faixas(r)}${grade(r, true)}<div style="height:18px"></div>`;
  }
  if (st.etapa === "pix" && st.reserva) {
    const rv = st.reserva, s = situacao(rv), nums = `<div class="chips grandes">${rv.nums.map(n => `<span class="${s}">${pad(n)}</span>`).join("")}</div>`;
    const como = r.metodo === "federal" ? "pela Loteria Federal" : "no app, ao vivo";
    if (s === "pago") return `<div class="pix"><div class="status pago${st.festa === rv.grupo ? " festa" : ""}"><span class="selo-ok" aria-hidden="true">✓</span>
        <h2>Pagamento confirmado!</h2><p>Seus números estão garantidos.</p>${nums}
        <p class="small">${rv.nome ? `Reservado para <b>${esc(rv.nome)}</b> · ` : ""}${brl(rv.total)} · código <b>${codigo(id + rv.grupo)}</b></p></div>
        <p class="small muted">Sorteio ${esc(r.data || "em data a definir")}, ${como}. Boa sorte! Se ganhar, ${esc(r.pixNome)} fala com você pelo WhatsApp. Guarde este link: ele mostra seus números quando quiser.</p>
        <button class="btn btn-main" data-act="mais">Escolher mais números</button><button class="btn" data-act="cartela">Ver a cartela</button></div>`;
    if (s === "expirado") return `<div class="pix"><div class="status expirado"><h2>Reserva expirada</h2>${nums}
        <p>O prazo para pagar acabou e esses números voltaram a ficar livres. Se você já pagou, mande o comprovante para ${esc(r.pixNome)}.</p></div>
        <button class="btn btn-main" data-act="mais">Escolher números de novo</button></div>`;
    return `<div class="pix"><div class="status aguardando"><span class="pulso" aria-hidden="true"></span><div><b>${s === "carregando" ? "Conferindo seu pedido…" : "Aguardando seu Pix"}</b>
        <p class="small">${prazo(rv) || `Pague em até ${r.prazoHoras} h`}. Esta tela muda sozinha quando o pagamento for confirmado: pode deixar aberta ou voltar depois por este mesmo link.</p></div></div>
      ${nums}<span class="eyebrow muted">Pague com Pix</span><span class="valor">${brl(rv.total)}</span>
      <div id="qr" aria-label="QR Code do Pix"></div><span class="code" id="pixcode">${esc(rv.payload)}</span>
      <button class="btn btn-main" data-act="copiar">Copiar Pix copia e cola</button>
      <p class="exato">Pague exatamente ${brl(rv.total)}. Os centavos identificam o seu pedido.</p>
      <p class="small muted">O dinheiro vai direto para ${esc(r.pixNome)}. Pagando pelo código acima, o valor já vai certo. Depois do prazo, os números voltam a ficar livres.</p>
      ${rv.comprovante
        ? `<p class="ok">Comprovante enviado. Falta o organizador conferir.</p>`
        : `<label class="btn" for="comp">${st.enviando2 ? "Enviando…" : "Enviar comprovante (opcional)"}</label><input id="comp" type="file" accept="image/*" hidden>
           <p class="small muted">Se quiser agilizar, anexe o print do pagamento.</p>`}
      <button class="btn" data-act="mais">Escolher mais números</button></div>`;
  }
  if (st.etapa === "form") {
    const nums = st.sel.slice().sort((a, b) => a - b);
    return `<form class="form" onsubmit="reservar(event)" novalidate><h2 style="font-size:21px;margin-top:8px">Reservar ${nums.length} número${nums.length > 1 ? "s" : ""}</h2>
      <div class="chips">${nums.map(n => `<span>${pad(n)}</span>`).join("")}</div>${st.erro ? `<p class="err">${esc(st.erro)}</p>` : ""}
      <label for="nome">Seu nome<input class="input" id="nome" name="nome" required maxlength="60" autocomplete="name" placeholder="Como o organizador te conhece"></label>
      <label for="tel">WhatsApp<input class="input" id="tel" name="tel" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678"><span class="hint">Só o organizador vê. Serve para avisar se você ganhar.</span></label>
      <div class="row"><button type="button" class="btn" data-act="voltar">Voltar</button><button class="btn btn-main" type="submit"${st.enviando ? " disabled" : ""}>${st.enviando ? "Reservando…" : "Reservar " + brl(nums.length * r.preco)}</button></div></form>`;
  }
  const tot = st.sel.length * r.preco;
  return `${st.erro ? `<p class="err">${esc(st.erro)}</p>` : ""}${seusNumeros()}<div class="legenda"><span><span class="dot"></span>Livre</span><span><span class="dot d-sel"></span>Sua escolha</span>${st.pedidos.length ? `<span><span class="tag-seu">SEU</span>Seus</span>` : ""}<span><span class="dot d-res"></span>Aguardando Pix</span><span><span class="dot d-vend"></span>Vendido</span></div>
    ${faixas(r)}${grade(r, false)}
    <div class="cart"><span>${st.sel.length ? `<b>${st.sel.length}</b> número${st.sel.length > 1 ? "s" : ""} · <b>${brl(tot)}</b>` : '<span class="muted">Toque nos números livres</span>'}</span>
    <button class="btn btn-main" data-act="form"${st.sel.length ? "" : " disabled"}>Reservar</button></div>`;
}


/* ---------- comprovante ---------- */
function reduzir(file) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.7, out = c.toDataURL("image/jpeg", q);
      while (out.length > 380000 && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > 420000 ? falha(new Error("grande")) : ok(out);
    };
    img.onerror = () => falha(new Error("imagem"));
    img.src = url;
  });
}
document.addEventListener("change", async e => {
  if (e.target.id !== "comp" || !st.reserva || !st.rifa) return;
  const file = e.target.files[0]; if (!file) return;
  st.enviando2 = true; render();
  try {
    const db = getFirestore(), ref = doc(db, "rifas", id), n = st.reserva.nums[0], g = st.reserva.grupo;
    const img = await reduzir(file), b = writeBatch(db);
    b.set(doc(ref, "comprovantes", g), { img, n, ts: serverTimestamp() });
    b.set(doc(ref, "enviados", g), { n, ts: serverTimestamp() });
    await b.commit();
    st.reserva.comprovante = true;
    salvarPedidos();
    toast("Comprovante enviado");
  } catch (err) {
    toast("Não deu para enviar a imagem. Tente de novo ou mande para o organizador.");
  }
  st.enviando2 = false; render();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || !st.rifa) return;
  if (t.dataset.n) { const n = +t.dataset.n, i = st.sel.indexOf(n); i < 0 ? st.sel.push(n) : st.sel.splice(i, 1); st.erro = ""; render() }
  else if (t.dataset.faixa) { st.faixa = +t.dataset.faixa; render() }
  else if (t.dataset.act === "form") { st.etapa = "form"; st.erro = ""; render(); $("#nome")?.focus() }
  else if (t.dataset.act === "voltar") { st.etapa = "grade"; render() }
  else if (t.dataset.act === "mais" || t.dataset.act === "cartela") { st.etapa = "grade"; st.reserva = null; render(); scrollTo(0, 0) }
  else if (t.dataset.ver) { st.reserva = st.pedidos.find(p => p.grupo === t.dataset.ver) || null; st.etapa = st.reserva ? "pix" : "grade"; render(); scrollTo(0, 0) }
  else if (t.dataset.tirar) { st.pedidos = st.pedidos.filter(p => p.grupo !== t.dataset.tirar); salvarPedidos(); render() }
  else if (t.dataset.act === "copiar") {
    navigator.clipboard.writeText(st.reserva.payload).then(() => toast("Pix copiado. Cole no app do seu banco."), () => {
      const rg = document.createRange(); rg.selectNodeContents($("#pixcode")); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Código selecionado. Copie e cole no app do banco.");
    });
  }
});
</script>
</body>
