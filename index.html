<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartela Pronta</title>
<meta name="description" content="Escolha seus números da rifa e pague com Pix.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap">
<style>
/* Bilhete destacável: cabeçalho índigo com o prêmio, picote, cartela de números e barra de reserva fixa embaixo */
:root{
  --bg:#F4F3FB; --surface:#FFFFFF; --surface-2:#ECEBF7; --ink:#1B1838; --muted:#625E85; --line:#DAD8EC;
  --indigo:#3F3DBC; --on-indigo:#FFFFFF; --coral:#FF6B57; --on-coral:#FFFFFF;
  --ambar:#E8A33D; --ambar-soft:#FCEFD8; --erro:#D63B3B; --erro-soft:#FBE2E2; --qr:#FFFFFF;
  --shadow:0 1px 2px rgba(27,24,56,.06),0 10px 30px rgba(27,24,56,.10);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#100F1E; --surface:#1A1930; --surface-2:#24223F; --ink:#ECEAFB; --muted:#A4A0C8; --line:#322F55;
  --indigo:#8E8CF5; --on-indigo:#14123A; --coral:#FF8A78; --on-coral:#2B0A04;
  --ambar:#F2B657; --ambar-soft:#3A2B12; --erro:#F27A7A; --erro-soft:#3E1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.12;text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:24px}
.marca{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--muted);margin:4px 0 14px}
.marca i{width:22px;height:16px;border-radius:3px;background:var(--coral);display:inline-block}
.ticket{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.t-head{background:var(--indigo);color:var(--on-indigo);padding:22px 22px 18px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;opacity:.8}
.t-head h1{font-size:28px;font-weight:800}
.premio{margin:0;font-size:17px;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 2px}
.facts div{border-top:1.5px solid color-mix(in srgb,var(--on-indigo) 30%,transparent);padding-top:6px;min-width:0}
.facts dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:color-mix(in srgb,var(--on-indigo) 20%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral)}
.t-head .small{margin:0;font-size:13px;opacity:.85}
.perf{height:18px;position:relative;background-image:radial-gradient(circle,var(--line) 2px,transparent 2.5px);background-size:14px 18px;background-position:center;background-repeat:repeat-x}
.perf::before,.perf::after{content:"";position:absolute;top:0;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.perf::before{left:-9px}.perf::after{right:-9px}
.corpo{padding:6px 18px 0;display:flex;flex-direction:column;gap:14px}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;border:1px solid var(--line);background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.n{font-family:var(--f-mono);font-weight:700;font-size:14px;padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-variant-numeric:tabular-nums;transition:transform .12s}
.n:hover:not(:disabled){transform:translateY(-1px);border-color:var(--indigo)}
.n.sel{background:var(--coral);border-color:var(--coral);color:var(--on-coral)}
.n:disabled{background:var(--surface-2);border-color:transparent;color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.n.win{outline:3px solid var(--coral);outline-offset:2px;text-decoration:none;color:var(--ink)}
.faixas{display:flex;gap:6px;flex-wrap:wrap}
.faixas button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;font-family:var(--f-mono)}
.faixas button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.cart{position:sticky;bottom:0;margin:0 -18px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.cart b{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-main{background:var(--coral);color:var(--on-coral);border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.form{display:flex;flex-direction:column;gap:12px;padding-bottom:20px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
.hint{font-weight:400;font-size:12px;color:var(--muted)}
.input{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips span{font-family:var(--f-mono);font-size:13px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--ambar-soft);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.err{background:var(--erro-soft);color:var(--erro);border-radius:12px;padding:10px 12px;margin:0;font-weight:600}
.pix{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-bottom:22px}
.ok{background:var(--ambar-soft);border-radius:99px;padding:6px 12px;font-weight:700}
.valor{font-family:var(--f-display);font-size:36px;font-weight:800;font-variant-numeric:tabular-nums}
#qr{background:var(--qr);padding:12px;border-radius:14px;line-height:0}
.code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:10px;border-radius:10px;word-break:break-all;text-align:left;width:100%}
.pix p{margin:0}
.exato{background:var(--ambar-soft);border-radius:12px;padding:10px 12px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.winner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;background:var(--surface-2);border-radius:14px;padding:16px;margin-top:8px}
.winner .big{font-family:var(--f-mono);font-weight:700;font-size:40px;background:var(--coral);color:var(--on-coral);padding:8px 16px;border-radius:10px}
.winner p{margin:2px 0}
.estado{padding:40px 22px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.estado p{margin:0;max-width:40ch}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
.rodape{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
@media (max-width:420px){.t-head h1{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}.n{font-size:13px;padding:9px 0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="marca"><i aria-hidden="true"></i>Cartela Pronta</div>
  <article class="ticket" id="app"><div class="estado"><p class="muted">Carregando a rifa…</p></div></article>
  <p class="rodape">O pagamento vai direto para o organizador. A Cartela Pronta só organiza os números.</p>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = v => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const FAIXA = 200;

/* ---------- Pix copia e cola (mesma regra do app) ---------- */
const campo = (id, v) => id + String(v.length).padStart(2, "0") + v;
function crc16(s) { let c = 0xFFFF; for (let i = 0; i < s.length; i++) { c ^= s.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = (c & 0x8000) ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF } return c.toString(16).toUpperCase().padStart(4, "0") }
const limpar = s => String(s).normalize("NFD").replace(/\p{M}/gu, "").replace(/[^A-Za-z0-9 ]/g, "").toUpperCase().trim();
function codigo(s) { let h = 5381; for (const c of s) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return h.toString(36).toUpperCase().padStart(7, "0").slice(-7) }
function pix(r, valor, ref) {
  const txid = ("RIFA" + codigo(r.id + ref)).slice(0, 25);
  const p = campo("00", "01") + campo("26", campo("00", "br.gov.bcb.pix") + campo("01", r.pixChave.trim())) + campo("52", "0000") + campo("53", "986")
    + campo("54", valor.toFixed(2)) + campo("58", "BR") + campo("59", limpar(r.pixNome).slice(0, 25) || "RECEBEDOR")
    + campo("60", limpar(r.cidade).slice(0, 15) || "BRASIL") + campo("62", campo("05", txid)) + "6304";
  return p + crc16(p);
}

/* ---------- estado ---------- */
const id = new URLSearchParams(location.search).get("r");
const st = { rifa: null, ocupados: new Set(), info: new Map(), sel: [], enviando2: false, etapa: "grade", faixa: 0, erro: "", enviando: false, reserva: null };
const LS = "cartela-reserva-" + id;
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) { st.reserva = s; st.etapa = "pix" } } catch (e) { }

const pad = n => String(n).padStart(String(st.rifa.qtd).length, "0");
let tt; function toast(t) { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 2800) }

function estado(titulo, texto) { $("#app").innerHTML = `<div class="estado"><h2>${esc(titulo)}</h2><p class="muted">${esc(texto)}</p></div>` }

if (!id) estado("Link incompleto", "Peça ao organizador o link completo da rifa.");
else if (firebaseConfig.apiKey === "COLE_AQUI") estado("Página ainda não configurada", "O organizador precisa colar a configuração do Firebase no arquivo config.js.");
else {
  const db = getFirestore(initializeApp(firebaseConfig));
  const ref = doc(db, "rifas", id);
  onSnapshot(ref, s => {
    if (!s.exists()) { estado("Rifa não encontrada", "Confira o link com o organizador."); return }
    st.rifa = { id, ...s.data() }; render();
  }, () => estado("Não deu para abrir a rifa", "Verifique sua internet e tente de novo."));
  onSnapshot(collection(ref, "numeros"), s => {
    st.info = new Map(s.docs.map(d => [+d.id, d.data()]));
    st.ocupados = new Set(st.info.keys());
    const antes = st.sel.length; st.sel = st.sel.filter(n => !st.ocupados.has(n));
    if (antes !== st.sel.length && st.etapa !== "pix") toast("Alguém acabou de pegar um número que você tinha escolhido");
    if (st.rifa) render();
  });

  window.reservar = async (ev) => {
    ev.preventDefault();
    const f = new FormData(ev.target), nome = String(f.get("nome")).trim(), tel = String(f.get("tel")).trim();
    if (nome.length < 2 || tel.replace(/\D/g, "").length < 10) { st.erro = "Preencha seu nome e um WhatsApp com DDD."; render(); return }
    const nums = st.sel.slice().sort((a, b) => a - b);
    const grupo = codigo(nome + tel + Date.now());
    const base = Math.round(nums.length * st.rifa.preco * 100);
    const usados = new Set([...st.info.values()].filter(d => d.status === "reservado" && d.v).map(d => d.v));
    const livres = []; for (let c = 1; c <= 99; c++) if (!usados.has(base + c)) livres.push(base + c);
    const valorCent = livres.length ? livres[Math.floor(Math.random() * livres.length)] : base + 1 + Math.floor(Math.random() * 99);
    const b = writeBatch(db);
    for (const n of nums) {
      b.set(doc(ref, "numeros", String(n)), { status: "reservado", ts: serverTimestamp(), v: valorCent });
      b.set(doc(ref, "reservas", String(n)), { nome: nome.slice(0, 60), tel: tel.slice(0, 20), ts: serverTimestamp(), grupo });
    }
    st.enviando = true; st.erro = ""; render();
    try {
      await b.commit();
      const total = valorCent / 100;
      st.reserva = { nums, total, payload: pix(st.rifa, total, grupo), grupo, comprovante: false };
      try { localStorage.setItem(LS, JSON.stringify(st.reserva)) } catch (e) { }
      st.sel = []; st.etapa = "pix"; scrollTo(0, 0);
    } catch (e) {
      st.erro = "Um desses números acabou de ser escolhido por outra pessoa. Confira a cartela e tente de novo.";
      st.etapa = "grade";
    }
    st.enviando = false; render();
  };
}

/* ---------- telas ---------- */
function render() {
  const r = st.rifa; if (!r) return;
  const usados = st.ocupados.size, metodo = r.metodo === "federal" ? "Loteria Federal" : "No app";
  $("#app").innerHTML = `<header class="t-head"><span class="eyebrow">Rifa de ${esc(r.pixNome)}</span><h1>${esc(r.nome)}</h1><p class="premio">${esc(r.premio)}</p>
    <dl class="facts"><div><dt>Cada número</dt><dd>${brl(r.preco)}</dd></div><div><dt>Sorteio</dt><dd>${esc(r.data || "a definir")}</dd></div><div><dt>Como</dt><dd>${metodo}</dd></div></dl>
    <div class="bar"><i style="width:${(usados / r.qtd * 100).toFixed(2)}%"></i></div><p class="small">${usados} de ${r.qtd} números já escolhidos</p></header>
    <div class="perf" aria-hidden="true"></div><div class="corpo">${corpo(r)}</div>`;
  if (st.etapa === "pix" && st.reserva && window.QRCode) {
    const el = $("#qr"); el.innerHTML = "";
    try { new QRCode(el, { text: st.reserva.payload, width: 180, height: 180, colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M }) } catch (e) { el.hidden = true }
  }
}
function faixas(r) {
  if (r.qtd <= FAIXA) return "";
  let h = ""; for (let i = 0; i * FAIXA < r.qtd; i++) h += `<button data-faixa="${i}" aria-pressed="${i === st.faixa}">${pad(i * FAIXA + 1)}–${pad(Math.min(r.qtd, (i + 1) * FAIXA))}</button>`;
  return `<div class="faixas">${h}</div>`;
}
function grade(r, travada) {
  const ini = st.faixa * FAIXA + 1, fim = Math.min(r.qtd, (st.faixa + 1) * FAIXA); let h = "";
  for (let n = ini; n <= fim; n++) {
    const win = r.vencedor && r.vencedor.numero === n;
    if (st.ocupados.has(n) || travada) h += `<button class="n${win ? " win" : ""}" disabled aria-label="Número ${pad(n)} indisponível">${pad(n)}</button>`;
    else { const s = st.sel.includes(n); h += `<button class="n${s ? " sel" : ""}" data-n="${n}" aria-pressed="${s}">${pad(n)}</button>` }
  }
  return `<div class="grid">${h}</div>`;
}
function corpo(r) {
  if (r.status === "sorteada" && r.vencedor) {
    return `<div class="winner"><span class="big">${pad(r.vencedor.numero)}</span><div><span class="eyebrow muted">Resultado</span><h3>${esc(r.vencedor.primeiroNome || "Ganhador")} ganhou!</h3><p class="small">${esc(r.vencedor.detalhe || "")}</p></div></div>${faixas(r)}${grade(r, true)}<div style="height:18px"></div>`;
  }
  if (st.etapa === "pix" && st.reserva) {
    const rv = st.reserva;
    return `<div class="pix"><span class="ok">Reservados: ${rv.nums.map(pad).join(", ")}</span><span class="eyebrow muted">Pague com Pix</span><span class="valor">${brl(rv.total)}</span>
      <div id="qr" aria-label="QR Code do Pix"></div><span class="code" id="pixcode">${esc(rv.payload)}</span>
      <button class="btn btn-main" data-act="copiar">Copiar Pix copia e cola</button>
      <p class="exato">Pague exatamente ${brl(rv.total)}. Os centavos identificam o seu pedido.</p>
      <p class="small muted">O dinheiro vai direto para ${esc(r.pixNome)}. Pague em até ${r.prazoHoras} h, senão os números voltam a ficar livres. Pagando pelo código acima, o valor já vai certo.</p>
      ${rv.comprovante
        ? `<p class="ok">Comprovante enviado. O organizador vai conferir.</p>`
        : `<label class="btn" for="comp">${st.enviando2 ? "Enviando…" : "Enviar comprovante (opcional)"}</label><input id="comp" type="file" accept="image/*" hidden>
           <p class="small muted">Se quiser agilizar, anexe o print do pagamento.</p>`}
      <button class="btn" data-act="mais">Escolher mais números</button></div>`;
  }
  if (st.etapa === "form") {
    const nums = st.sel.slice().sort((a, b) => a - b);
    return `<form class="form" onsubmit="reservar(event)" novalidate><h2 style="font-size:21px;margin-top:8px">Reservar ${nums.length} número${nums.length > 1 ? "s" : ""}</h2>
      <div class="chips">${nums.map(n => `<span>${pad(n)}</span>`).join("")}</div>${st.erro ? `<p class="err">${esc(st.erro)}</p>` : ""}
      <label for="nome">Seu nome<input class="input" id="nome" name="nome" required maxlength="60" autocomplete="name" placeholder="Como o organizador te conhece"></label>
      <label for="tel">WhatsApp<input class="input" id="tel" name="tel" required maxlength="20" inputmode="tel" autocomplete="tel" placeholder="(11) 91234-5678"><span class="hint">Só o organizador vê. Serve para avisar se você ganhar.</span></label>
      <div class="row"><button type="button" class="btn" data-act="voltar">Voltar</button><button class="btn btn-main" type="submit"${st.enviando ? " disabled" : ""}>${st.enviando ? "Reservando…" : "Reservar " + brl(nums.length * r.preco)}</button></div></form>`;
  }
  const tot = st.sel.length * r.preco;
  return `${st.erro ? `<p class="err">${esc(st.erro)}</p>` : ""}<div class="legenda"><span><span class="dot"></span>Livre</span><span><span class="dot" style="background:var(--coral);border-color:var(--coral)"></span>Sua escolha</span><span><span class="dot" style="background:var(--surface-2);border-color:transparent"></span>Já escolhido</span></div>
    ${faixas(r)}${grade(r, false)}
    <div class="cart"><span>${st.sel.length ? `<b>${st.sel.length}</b> número${st.sel.length > 1 ? "s" : ""} · <b>${brl(tot)}</b>` : '<span class="muted">Toque nos números livres</span>'}</span>
    <button class="btn btn-main" data-act="form"${st.sel.length ? "" : " disabled"}>Reservar</button></div>`;
}


/* ---------- comprovante ---------- */
function reduzir(file) {
  return new Promise((ok, falha) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 900, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.7, out = c.toDataURL("image/jpeg", q);
      while (out.length > 380000 && q > 0.3) { q -= 0.1; out = c.toDataURL("image/jpeg", q); }
      out.length > 420000 ? falha(new Error("grande")) : ok(out);
    };
    img.onerror = () => falha(new Error("imagem"));
    img.src = url;
  });
}
document.addEventListener("change", async e => {
  if (e.target.id !== "comp" || !st.reserva || !st.rifa) return;
  const file = e.target.files[0]; if (!file) return;
  st.enviando2 = true; render();
  try {
    const db = getFirestore(), ref = doc(db, "rifas", id), n = st.reserva.nums[0], g = st.reserva.grupo;
    const img = await reduzir(file), b = writeBatch(db);
    b.set(doc(ref, "comprovantes", g), { img, n, ts: serverTimestamp() });
    b.set(doc(ref, "enviados", g), { n, ts: serverTimestamp() });
    await b.commit();
    st.reserva.comprovante = true;
    try { localStorage.setItem(LS, JSON.stringify(st.reserva)) } catch (e) { }
    toast("Comprovante enviado");
  } catch (err) {
    toast("Não deu para enviar a imagem. Tente de novo ou mande para o organizador.");
  }
  st.enviando2 = false; render();
});

document.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t || !st.rifa) return;
  if (t.dataset.n) { const n = +t.dataset.n, i = st.sel.indexOf(n); i < 0 ? st.sel.push(n) : st.sel.splice(i, 1); st.erro = ""; render() }
  else if (t.dataset.faixa) { st.faixa = +t.dataset.faixa; render() }
  else if (t.dataset.act === "form") { st.etapa = "form"; st.erro = ""; render(); $("#nome")?.focus() }
  else if (t.dataset.act === "voltar") { st.etapa = "grade"; render() }
  else if (t.dataset.act === "mais") { st.etapa = "grade"; st.reserva = null; try { localStorage.removeItem(LS) } catch (e) { } render() }
  else if (t.dataset.act === "copiar") {
    navigator.clipboard.writeText(st.reserva.payload).then(() => toast("Pix copiado. Cole no app do seu banco."), () => {
      const rg = document.createRange(); rg.selectNodeContents($("#pixcode")); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Código selecionado. Copie e cole no app do banco.");
    });
  }
});
</script>
</body>
